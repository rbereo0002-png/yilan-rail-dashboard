name: Contract control regressions
on:
  push:
    branches:
      - refactor/single-source-review-workflow-20261118
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All contract and review tests
        run: node --test tests/*.test.js
